name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build + ctest (host/SIM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure (treat warnings as errors)
        run: cmake -S . -B build/host -DCMAKE_C_FLAGS="-Werror"

      - name: Build
        run: cmake --build build/host -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build/host --output-on-failure
