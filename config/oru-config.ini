# ---------------------------------------------------------------------------
# O-RU runtime configuration (host/SIM friendly).
#
# In a real deployment these values are delivered over the M-plane
# (NETCONF/YANG). This flat file mirrors the same fields so the stack is
# runnable on a host. See docs/05-mplane-splane.md.
# ---------------------------------------------------------------------------

[carrier]
band            = n78
duplex          = TDD
center_freq_hz  = 3500000000     ; 3.5 GHz
bandwidth_hz    = 100000000      ; 100 MHz
scs_hz          = 30000          ; 30 kHz numerology (mu=1)

[array]
num_tx          = 4              ; ADRV9025 supports up to 4T
num_rx          = 4              ; ... and 4R

[fronthaul]
iface           = eth0
du_mac          = 00:11:22:33:44:55
vlan_id         = 100
# eAxC / PC_ID range can be added here in Phase 1

[sync]
ptp_profile     = G.8275.1       ; telecom PTP profile
lls_class       = C3             ; O-RAN sync topology class

[radio]
# Path to the ADI TES-generated profile/.bin on the target.
profile_path    = /opt/oru/adrv9025_profile.bin
